name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          set -e
          sdkmanager=$(find "$ANDROID_HOME" -path '*/bin/sdkmanager' | head -1)
          yes | "$sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug
        run: ./gradlew --no-daemon :module:assembleDebug

      - name: Verify xposed metadata
        run: |
          set -e
          apk=$(ls module/build/outputs/apk/debug/*.apk | head -1)
          unzip -l "$apk" | grep -E 'META-INF/xposed/(java_init.list|module.prop|scope.list)'

      - uses: actions/upload-artifact@v4
        with:
          name: OhMiCall-debug
          path: module/build/outputs/apk/debug/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          set -e
          sdkmanager=$(find "$ANDROID_HOME" -path '*/bin/sdkmanager' | head -1)
          yes | "$sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ohmicall.jks"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/ohmicall.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :module:assembleRelease

      - name: Verify signature
        run: |
          set -e
          apk=$(ls module/build/outputs/apk/release/*.apk | head -1)
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: module/build/outputs/apk/release/*.apk
